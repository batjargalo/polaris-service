spring.application.name=polaris
#---------------------
#Swagger configuration
#---------------------
info.name=polaris-service
info.description=Polaris service
info.version=1.0
info.contact.owner=IOTech
info.contact.email=hello@iotech.mn
springdoc.packagesToScan=mn.io.polaris.controller
#---------------------
#Server configuration
#---------------------
server.port=39083
server.servlet.context-path=/polaris
#----------------------
#Database configuration
#----------------------
spring.datasource.username=bgpay
# spring.datasource.password=BG@953#pglbs25$Bt
spring.datasource.password=BG@953#pglbs25$Bt
#spring.datasource.url=jdbc:postgresql://bgdb.bichilglobus.mn:5432/bichilglobus?currentSchema=bgpay
# spring.datasource.url=jdbc:postgresql://mstrdb.bichilglobus.mn:5432/bichilglobus?currentSchema=bgpay
spring.datasource.url=jdbc:postgresql://mstrdb.bichilglobus.mn:5432/bichilglobus?currentSchema=bgpay
#----------------------

#performance config added from Munkh
server.undertow.threads.io=32
server.undertow.threads.worker=512
server.undertow.buffer-size=16384
server.undertow.direct-buffers=true
server.undertow.always-set-keep-alive=true
server.tomcat.accept-count=1000

#HikariCP (Database - MOST CRITICAL)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000

#JPA Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.hibernate.ddl-auto=none

#Cache (Redis/Memory)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=5m

#Async Processing
spring.task.execution.pool.core-size=16
spring.task.execution.pool.max-size=128
spring.task.execution.pool.queue-capacity=10000
spring.task.execution.thread-name-prefix=customer-async-

#Other configuration
#----------------------
cross.origin.max.age=1800000
spring.jpa.open-in-view=false
server.error.include-message=always

